{% extends "admin/base_site.html" %}
{% load i18n static humanize log %}

{% block bodyclass %}{{ block.super }} dashboard{% endblock %}

{% block breadcrumbs %}
<div class="breadcrumbs">
    <span class="current-page">Dashboard</span>
</div>
{% endblock %}

{% block content_title %}{% endblock %}

{% block content %}
{% get_admin_log 10 as admin_log %}

<!-- Root container for React -->
<div id="react-dashboard-root"></div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Convert Django Context to JS Object -->
<script>
    window.DJANGO_CONTEXT = {
        totalOrders: parseInt("{{ total_orders|default:0 }}"),
        totalSales: parseFloat("{{ total_sales|default:0 }}"),
        totalProducts: parseInt("{{ total_products|default:0 }}"),
        inventoryValue: parseFloat("{{ inventory_value|default:0 }}"),
        totalUsers: parseInt("{{ total_users|default:0 }}"),
        totalBanners: parseInt("{{ total_banners|default:0 }}"),
        totalReviews: parseInt("{{ total_reviews|default:0 }}"),
        inStock: parseInt("{{ in_stock|default:0 }}"),
        lowStock: parseInt("{{ low_stock|default:0 }}"),
        outOfStock: parseInt("{{ out_of_stock|default:0 }}"),
        unavailableProducts: parseInt("{{ unavailable_products|default:0 }}"),
        inStockPercent: parseInt("{{ in_stock_percent|default:0 }}"),
        lowStockPercent: parseInt("{{ low_stock_percent|default:0 }}"),
        outOfStockPercent: parseInt("{{ out_of_stock_percent|default:0 }}"),
        unavailablePercent: parseInt("{{ unavailable_percent|default:0 }}"),
        salesSeries: [
            {% for item in sales_series %}
            {
                date: "{{ item.date|default:''|escapejs }}",
                label: "{{ item.label|default:''|escapejs }}",
                orders: parseInt("{{ item.orders|default:0 }}"),
                revenue: parseFloat("{{ item.revenue|default:0 }}")
            },
            {% endfor %}
        ],
        categoryStats: [
            {% for item in category_stats %}
            {
                name: "{{ item.name|escapejs }}",
                productCount: parseInt("{{ item.product_count|default:0 }}"),
                share: parseInt("{{ item.share|default:0 }}")
            },
            {% endfor %}
        ],
        topProducts: [
            {% for item in top_products %}
            {
                id: "{{ item.id }}",
                name: "{{ item.name|escapejs }}",
                category: "{{ item.category.name|escapejs }}",
                stock: parseInt("{{ item.stock|default:0 }}"),
                price: parseFloat("{{ item.price|default:0 }}").toLocaleString('en-IN'),
                imageUrl: "{% if item.images.all.0 %}{{ item.images.all.0.image.url }}{% endif %}"
            },
            {% endfor %}
        ],
        adminLog: [
            {% for entry in admin_log %}
            {
                user: "{{ entry.user.username|escapejs }}",
                isAddition: {% if entry.is_addition %}true{% else %}false{% endif %},
                isChange: {% if entry.is_change %}true{% else %}false{% endif %},
                objectRepr: "{{ entry.object_repr|escapejs }}",
                contentType: "{{ entry.content_type.name|escapejs }}",
                actionTime: "{{ entry.action_time|naturaltime|escapejs }}"
            },
            {% endfor %}
        ]
    };
</script>

<script type="module" src="{% static 'admin/react/dashboard.js' %}?v={% now 'U' %}"></script>
{% endblock %}
