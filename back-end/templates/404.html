{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Moxie</title>
    <link rel="icon" type="image/png" href="{% static 'images/moxie.png' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: #0f111a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            text-align: center;
            max-width: 540px;
            width: 100%;
            background: #181b2a;
            border: 1px solid #2d334d;
            border-radius: 20px;
            padding: 48px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .logo {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            object-fit: contain;
        }
        .badge {
            display: inline-block;
            background: rgba(102, 87, 236, 0.15);
            color: #9d8dfc;
            border: 1px solid rgba(102, 87, 236, 0.3);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: #6657ec;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(102, 87, 236, 0.35);
        }
        .btn-primary:hover {
            background: #5344d9;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #24293d;
            color: #cbd5e1;
            border: 1px solid #3b4263;
        }
        .btn-secondary:hover {
            background: #2d344e;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{% static 'images/moxie.png' %}" alt="Moxie Logo" class="logo">
        <div>
            <span class="badge">404 Error</span>
        </div>
        <h1>Lost in the Style Cosmos?</h1>
        <p>The page you are searching for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <div class="btn-group">
            <a href="/" class="btn btn-primary">
                <span>Return to Storefront</span>
            </a>
            <a href="/admin/" class="btn btn-secondary">
                <span>Admin Portal</span>
            </a>
        </div>
    </div>
</body>
</html>
